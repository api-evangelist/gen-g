name: Gen.G
description: Gen.G is a global esports organization founded in 2017 (originally KSV eSports) that connects
  the United States and Asia, operating from Los Angeles, Seoul, and Shanghai. It fields professional
  teams across League of Legends, Valorant, PUBG, Counter-Strike 2, Rocket League, Fortnite, Brawl Stars,
  Honor of Kings, Mobile Legends, NBA 2K, Overwatch, Rainbow Six Siege, and EA FC, and runs a youth esports
  academy program alongside merchandise and fan-engagement businesses. Backed by Canaan Partners among
  other investors, Gen.G was valued at roughly $250 million as of 2022. It is a consumer esports brand
  and merchandise operator with a Shopify-based storefront; it publishes no public developer API, so this
  profile carries company identity only.
